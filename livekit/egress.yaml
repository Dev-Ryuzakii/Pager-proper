# LiveKit Egress config — renders a room composite (every published track
# muxed together) to MP4. Needs its OWN redis (LiveKit server itself doesn't
# use one in single-node mode — this is unrelated, just Egress's internal
# IPC between the service and its per-recording handler process).
#
# Fill api_key/api_secret with the SAME pair from livekit.yaml's keys: block.

api_key: APIkey0000000000
api_secret: your-generated-secret-here

# Local LiveKit server, over the docker host network — not exposed publicly,
# so plain ws:// + insecure is fine here (this never leaves the VPS).
ws_url: ws://localhost:7880
insecure: true

redis:
  address: localhost:6379

log_level: info
